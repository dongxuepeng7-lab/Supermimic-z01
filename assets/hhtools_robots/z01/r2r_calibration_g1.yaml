notes: >-
  Match G1 zero-pose shoulder-to-elbow and elbow-to-wrist unit vectors using
  bounded least squares on Z01 shoulder pitch/roll and elbow yaw/pitch.
  Forearm residual is below 1e-5; upper-arm angular residual is about 1.5 deg
  because shoulder roll reaches its inward limit. This is geometric alignment,
  not hardware calibration. Z01 has five arm DOFs versus G1's seven.
